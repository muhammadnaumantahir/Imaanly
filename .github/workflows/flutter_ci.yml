name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: imaanly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test --coverage

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Web build
        run: flutter build web --release

  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Configure ephemeral Android release signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/ci
          keytool -genkeypair \
            -v \
            -keystore android/ci/imaanly-ci.jks \
            -storepass ci-release-password \
            -keypass ci-release-password \
            -alias imaanly-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Imaanly CI, OU=CI, O=Imaanly, L=Lahore, ST=Punjab, C=PK"
          cat > android/key.properties <<'EOF'
storePassword=ci-release-password
keyPassword=ci-release-password
keyAlias=imaanly-ci
storeFile=ci/imaanly-ci.jks
EOF

      - name: Android release APK build
        run: flutter build apk --release

      - name: Android release App Bundle build
        run: flutter build appbundle --release

      - name: Upload Android artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imaanly-android-release
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
