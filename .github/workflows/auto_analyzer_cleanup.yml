name: Temporary analyzer cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, '[auto-lint]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Apply safe Dart fixes
        run: dart fix --apply

      - name: Verify analyzer
        run: flutter analyze

      - name: Commit analyzer fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/workflows/auto_analyzer_cleanup.yml
          git commit -m "[auto-lint] Clean up analyzer warnings"
          git push origin main
