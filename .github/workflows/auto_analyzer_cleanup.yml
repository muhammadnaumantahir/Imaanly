name: Temporary analyzer cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, '[auto-lint]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Apply safe Dart fixes
        run: dart fix --apply

      - name: Apply remaining analyzer compatibility fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/src/screen/tafsir_view/tafsir_view.dart')
          text = path.read_text()
          old = '''onReorder: (oldIndex, newIndex) {\n                    setSheetState(() {\n                      var adjustedIndex = newIndex;\n                      if (adjustedIndex > oldIndex) adjustedIndex -= 1;\n                      final item = workingOrder.removeAt(oldIndex);\n                      workingOrder.insert(adjustedIndex, item);\n                    });\n                  },'''
          new = '''onReorderItem: (oldIndex, newIndex) {\n                    setSheetState(() {\n                      final item = workingOrder.removeAt(oldIndex);\n                      workingOrder.insert(newIndex, item);\n                    });\n                  },'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif 'onReorder:' in text:
              raise SystemExit('Unexpected onReorder formatting; refusing unsafe edit')
          PY

      - name: Verify analyzer
        run: flutter analyze

      - name: Commit analyzer fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/workflows/auto_analyzer_cleanup.yml
          git commit -m "[auto-lint] Clean up analyzer warnings"
          git push origin main
