name: Temporary analyzer cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, '[auto-lint]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Apply safe Dart fixes
        run: dart fix --apply

      - name: Apply remaining analyzer compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/src/screen/tafsir_view/tafsir_view.dart')
          text = path.read_text()
          old = '''onReorder: (oldIndex, newIndex) {
                              setSheetState(() {
                                var adjustedIndex = newIndex;
                                if (adjustedIndex > oldIndex) adjustedIndex -= 1;
                                final item = workingOrder.removeAt(oldIndex);
                                workingOrder.insert(adjustedIndex, item);
                              });
                            },'''
          if old not in text:
              old = '''onReorder: (oldIndex, newIndex) {
                    setSheetState(() {
                      var adjustedIndex = newIndex;
                      if (adjustedIndex > oldIndex) adjustedIndex -= 1;
                      final item = workingOrder.removeAt(oldIndex);
                      workingOrder.insert(adjustedIndex, item);
                    });
                  },'''
          new = '''onReorderItem: (oldIndex, newIndex) {
                    setSheetState(() {
                      final item = workingOrder.removeAt(oldIndex);
                      workingOrder.insert(newIndex, item);
                    });
                  },'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif 'onReorder:' in text:
              raise SystemExit('Unexpected onReorder formatting; refusing unsafe edit')

          path = Path('lib/src/shared/widgets/app_components.dart')
          text = path.read_text()
          text = text.replace('          ?trailing,', '          if (trailing case final widget?) widget,', 1)
          text = text.replace('AppSizes.chipRadius.r', 'AppSizes.radiusS.r', 1)
          path.write_text(text)
          PY

      - name: Verify analyzer
        run: flutter analyze

      - name: Commit analyzer fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot].email"
          git add -A
          git rm .github/workflows/auto_analyzer_cleanup.yml
          git commit -m "[auto-lint] Clean up analyzer warnings"
          git push origin main
